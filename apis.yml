name: Mentor Collective
description: >-
  Mentor Collective operates an AI Mentorship OS for higher education, powering
  peer mentoring, student success, and retention programs at colleges and
  universities. Its platform matches and onboards mentors and mentees, guides
  conversations with AI prompts, surfaces risk signals and belonging gaps, and
  turns connection data into real-time retention intelligence for institutions.
  Backed by Techstars, the company serves higher-education and workforce
  partners. As of this profile Mentor Collective publishes no public API,
  developer portal, SDKs, or machine-readable specifications; this repo captures
  its public web, blog, legal, and domain-security surface for the API
  Evangelist network.
